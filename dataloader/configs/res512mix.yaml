    clamp_max_depth: null

  - name: mvssynth
    data_path: datasets/train/mvssynth
    max_depth: 100.0
    weight: 0.06

    # Sky handling for outdoor/urban scenes (GTAV-based synthetic)
    handle_sky: true
    use_sky_dome: true
    sky_loss_weight: 0.01
